services:
  web:
    build: ./web
    env_file:
      - ./web/.env.development
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy

  server:
    build: ./server
    env_file:
      - ./server/.env.development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['SERVER_PORT'] + '/health')\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    env_file:
      - ./server/.env.development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p \"$${DB_PORT}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
