name: local-field-generation
services:
  generation-llm:
    image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    container_name: local-field-generation-llm
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
    volumes:
      - /home/yoon/dev/models/Qwen3.8-27B-TURBO-Fable-Cold-Fusion-735-882-Heretic-Uncensored-NM-DAU-NVFP4:/model:ro
      - ./.runtime/vllm:/cache
    command:
      - /model
      - --host
      - 0.0.0.0
      - --port
      - "30004"
      - --served-model-name
      - qwen3.8-27b-fable-nvfp4
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "2048"
      - --gpu-memory-utilization
      - "0.35"
      - --kv-cache-memory-bytes
      - "4294967296"
      - --enforce-eager
      - --limit-mm-per-prompt
      - '{"image":9,"video":0}'
      - --mm-processor-kwargs
      - '{"max_pixels":589824}'
      - --reasoning-parser
      - qwen3
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --structured-outputs-config
      - '{"backend":"guidance","disable_any_whitespace":true,"enable_in_reasoning":true}'
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30004/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
