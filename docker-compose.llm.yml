name: local-field-generation
services:
  generation-llm:
    image: vllm/vllm-openai@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
    container_name: local-field-generation-llm
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      LLM_HEALTH_URL: http://127.0.0.1:30004/health
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HOME: /cache/huggingface
      VLLM_CACHE_ROOT: /cache/vllm
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TRITON_CACHE_DIR: /cache/triton
    volumes:
      - ./serve_llm.py:/opt/local-field/serve_llm.py:ro
      - /home/yoon/dev/models/Erebus-RP-Engine-26B-A4B-NVFP4:/model:ro
      - ./.runtime/vllm:/cache
    entrypoint: [python3, /opt/local-field/serve_llm.py]
    command:
      - /model
      - --host
      - 0.0.0.0
      - --port
      - "30004"
      - --served-model-name
      - erebus-rp-engine-26b-a4b-nvfp4
      - --dtype
      - bfloat16
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "2048"
      - --gpu-memory-utilization
      - "0.2"
      - --kv-cache-memory-bytes
      - "4294967296"
      - --enforce-eager
      - --language-model-only
      - --reasoning-parser
      - gemma4
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
      - --structured-outputs-config
      - '{"backend":"guidance","disable_any_whitespace":true,"enable_in_reasoning":true}'
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:30004/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 300s
      retries: 10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
