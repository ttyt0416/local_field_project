services:
  web:
    build: ./web
    env_file:
      - ./web/.env.production
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      server:
        condition: service_healthy

  embedding:
    image: vllm/vllm-openai:v0.25.1
    command:
      - /models/bge-m3
      - --host
      - 0.0.0.0
      - --port
      - "30005"
      - --served-model-name
      - BAAI/bge-m3
      - --runner
      - pooling
      - --gpu-memory-utilization
      - "0.10"
      - --max-model-len
      - "8192"
      - --max-num-seqs
      - "8"
    volumes:
      - /home/yoon/dev/models/BAAI-bge-m3:/models/bge-m3:ro
    ports:
      - "30005:30005"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  server:
    build: ./server
    env_file:
      - ./server/.env.production
    environment:
      EMBEDDING_URL: http://embedding:30005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      web_log_db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:' + os.environ['SERVER_PORT'] + '/health')\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: pgvector/pgvector:pg16
    env_file:
      - ./server/.env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -p \"$${DB_PORT}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  web_log_db:
    image: postgres:16-alpine
    env_file:
      - ./server/.env.web-logs.production
    volumes:
      - web_log_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  web_log_postgres_data:
